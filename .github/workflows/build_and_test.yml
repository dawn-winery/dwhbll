name: Build and test

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer:
          - asan_ubsan
          - tsan
          - ubsan
          - lsan

    container:
      image: debian:forky

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y gcc-16 g++-16 cmake ninja-build liburing-dev pkgconf python3-minimal

      - name: Build
        run: |
          CC=gcc-16 CXX=g++-16 cmake -B build . -DCMAKE_BUILD_TYPE=Debug -DDWHBLL_SANITIZER=${{ matrix.sanitizer }} -DDWHBLL_TESTS=ON -G Ninja
          cmake --build build

      - name: Test
        run: |
          ./build/dwhbll_test
