name: Build and test

on:
  push:
    branches:
      - master

jobs:
  build:
    name: ${{ matrix.build_type }} | Sanitizer:${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        sanitizer: [OFF, asan_ubsan, tsan, lsan]

    container:
      image: debian:forky

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y gcc-16 g++-16 cmake ninja-build liburing-dev pkgconf python3-minimal

      - name: Build
        run: |
          CC=gcc-16 CXX=g++-16 cmake -B build . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_HARDEN=YES
            -DBUILD_HARDEN_EXPENSIVE=YES
            -DDWHBLL_SANITIZER=${{ matrix.sanitizer }} \
            -DDWHBLL_TESTS=ON \
            -DDWHBLL_BENCHMARKS=ON \
            -DDWHBLL_UNICODE_SUPPORT=YES
            -DDWHBLL_DWCC_CPP=YES
          cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1:check_initialization_order=1:strict_init_order=1:detect_stack_use_after_return=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
          LSAN_OPTIONS: "halt_on_error=1"
        run: |
          ./build/dwhbll_test
